<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SFP Mockup 4 — Scanner Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:    #070F1C;
  --surf:  #0B1624;
  --surf2: #0F1E33;
  --surf3: #142240;
  --brd:   #162135;
  --brd-hi:#1C2F4A;
  --blue:  #38BDF8;
  --blue-s:#0EA5E9;
  --blue-bg:rgba(56,189,248,0.07);
  --blue-hi:rgba(56,189,248,0.12);
  --profit:#34D399;
  --pr-bg: rgba(52,211,153,0.07);
  --loss:  #F87171;
  --text:  #CBD5E1;
  --text-s:#64748B;
  --text-m:#334155;
  --text-d:#1E2D3D;
  --font-s:'Space Grotesk', system-ui, sans-serif;
  --font-m:'Space Mono', 'Courier New', monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-spr: cubic-bezier(0.34, 1.35, 0.64, 1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;
}

html { height: 100%; }

body {
  min-height: 100dvh;
  background: #040A14;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 16px 80px;
  font-family: var(--font-s);
  color: var(--text);
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(56,189,248,0.04) 0%, transparent 60%);
  pointer-events: none;
}

.design-label {
  position: fixed;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-m);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: rgba(56,189,248,0.35);
  z-index: 100;
  white-space: nowrap;
}

.phone {
  width: 100%;
  max-width: 412px;
  background: var(--bg);
  border-radius: 40px;
  border: 1px solid rgba(56,189,248,0.08);
  overflow: hidden;
  position: relative;
  z-index: 1;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.8),
    0 64px 128px rgba(0,0,0,0.9),
    0 0 60px rgba(56,189,248,0.04);
  display: flex;
  flex-direction: column;
  min-height: 820px;
}

.notch {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 26px;
  background: #000;
  border-radius: 18px;
  z-index: 20;
}

/* ─── HEADER ─── */
.hdr {
  background: var(--bg);
  border-bottom: 1px solid var(--brd);
  padding: 52px var(--s5) var(--s3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-ring {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--blue);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.logo-ring::before {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--blue);
}

.logo-text {
  font-family: var(--font-s);
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
}

.logo-text span { color: var(--blue); }

.hdr-status {
  display: flex;
  align-items: center;
  gap: var(--s3);
}

.status-item {
  font-family: var(--font-m);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text-s);
}

.scan-mode-btn {
  font-family: var(--font-m);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue);
  background: var(--blue-bg);
  border: 1px solid rgba(56,189,248,0.25);
  border-radius: 20px;
  padding: 5px 12px;
  cursor: pointer;
  transition: filter 0.15s var(--ease-out), transform 0.1s var(--ease-out);
}
.scan-mode-btn:active { transform: scale(0.93); }
.scan-mode-btn:hover { filter: brightness(1.2); }

/* ─── VIEWFINDER ─── */
.viewfinder {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--surf);
  overflow: hidden;
  flex-shrink: 0;
}

/* Background texture */
.vf-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #0a1520 0%, #070f1c 100%);
}

/* Fine grid */
.vf-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(56,189,248,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Precision corner brackets — more refined than Mockup 1 */
.bracket {
  position: absolute;
  width: 28px; height: 28px;
  border-color: var(--blue);
  border-style: solid;
  opacity: 0.8;
  transition: opacity 0.3s;
}
.b-tl { top:16px; left:16px; border-width:2px 0 0 2px; }
.b-tr { top:16px; right:16px; border-width:2px 2px 0 0; }
.b-bl { bottom:16px; left:16px; border-width:0 0 2px 2px; }
.b-br { bottom:16px; right:16px; border-width:0 2px 2px 0; }

/* Bracket corner dots */
.bracket::before {
  content: '';
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--blue);
}
.b-tl::before { top:-1px; left:-1px; }
.b-tr::before { top:-1px; right:-1px; }
.b-bl::before { bottom:-1px; left:-1px; }
.b-br::before { bottom:-1px; right:-1px; }

/* Center crosshair */
.crosshair {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px;
  animation: crosshairIn 0.5s var(--ease-spr) 0.3s both;
}

@keyframes crosshairIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.ch-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(56,189,248,0.4);
}

.ch-inner {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1px solid var(--blue);
}

.ch-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 4px; height: 4px;
  background: var(--blue);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.ch-line-h, .ch-line-v {
  position: absolute;
  background: rgba(56,189,248,0.4);
}
.ch-line-h { top:50%; left:4px; right:4px; height:1px; transform:translateY(-50%); }
.ch-line-v { left:50%; top:4px; bottom:4px; width:1px; transform:translateX(-50%); }

/* AR bounding box on item */
.ar-box {
  position: absolute;
  top: 50%; left: 50%;
  width: 120px; height: 80px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(56,189,248,0.35);
  border-radius: 4px;
  animation: arBoxIn 0.6s var(--ease-out) 0.8s both;
}

@keyframes arBoxIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.ar-item {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  opacity: 0;
  animation: arItemIn 0.4s var(--ease-out) 1.0s forwards;
}

@keyframes arItemIn {
  to { opacity: 1; }
}

/* Scan beam — precise, thin */
.scan-beam {
  position: absolute;
  left: 16px; right: 16px;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(56,189,248,0.8) 30%,
    #38BDF8 50%,
    rgba(56,189,248,0.8) 70%,
    transparent 100%
  );
  box-shadow: 0 0 8px rgba(56,189,248,0.5);
  animation: beamSweep 2.5s linear infinite;
}

@keyframes beamSweep {
  0% { top: 16px; opacity: 0; }
  5% { opacity: 1; }
  95% { opacity: 1; }
  100% { top: calc(100% - 16px); opacity: 0; }
}

/* Confidence meter — vertical, left side */
.conf-meter {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 3px;
  animation: fadeIn 0.4s var(--ease-out) 1.2s both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.conf-seg {
  width: 3px;
  border-radius: 2px;
}
.conf-seg.filled { background: var(--blue); }
.conf-seg.empty { background: rgba(56,189,248,0.15); }

/* Item ID badge */
.item-id-badge {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 16px;
  background: rgba(7,15,28,0.9);
  backdrop-filter: blur(8px);
  border: 1px solid var(--brd-hi);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: badgeSlideIn 0.4s var(--ease-spr) 1.4s both;
}

@keyframes badgeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.badge-label {
  font-family: var(--font-m);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text-s);
}

.badge-item {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.05em;
}

.badge-status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-m);
  font-size: 9px;
  font-weight: 700;
  color: var(--profit);
}

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--profit);
  animation: livePulse 1.5s ease-in-out infinite;
}

@keyframes livePulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(0.7); }
}

/* ─── RESULT PANEL ─── */
.result-panel {
  flex: 1;
  background: var(--surf);
  border-top: 1px solid var(--brd-hi);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: var(--s4);
  gap: var(--s3);
  animation: panelSlideUp 0.5s var(--ease-out) 1.6s both;
}

@keyframes panelSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Decision header */
.decision-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.decision-label {
  font-family: var(--font-m);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text-m);
}

.decision-value {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.decision-chip {
  font-family: var(--font-s);
  font-size: 0.875rem;
  font-weight: 700;
  color: #000;
  background: var(--profit);
  border-radius: 6px;
  padding: 5px 12px;
  letter-spacing: 0.02em;
}

/* Numbers row */
.numbers-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s2);
}

.num-box {
  background: var(--surf2);
  border: 1px solid var(--brd-hi);
  border-radius: 10px;
  padding: var(--s3) var(--s4);
}

.num-label {
  font-family: var(--font-m);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text-s);
  margin-bottom: 4px;
}

.num-val {
  font-family: var(--font-s);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
}

.num-val.blue { color: var(--blue); }
.num-val.green { color: var(--profit); }

/* Compact breakdown */
.breakdown {
  background: var(--surf2);
  border: 1px solid var(--brd);
  border-radius: 10px;
  overflow: hidden;
}

.bk-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px var(--s4);
  font-family: var(--font-m);
  font-size: 11px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  animation: bkIn 0.3s var(--ease-out) both;
}
.bk-row:last-child { border-bottom: none; }
.bk-row:nth-child(1){animation-delay:1.8s}
.bk-row:nth-child(2){animation-delay:1.85s}
.bk-row:nth-child(3){animation-delay:1.9s}
.bk-row:nth-child(4){animation-delay:1.95s}
.bk-row.total { background: rgba(56,189,248,0.04); }

@keyframes bkIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.bk-k { color: var(--text-s); }
.bk-v { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.bk-v.neg { color: var(--loss); }
.bk-v.pos { color: var(--profit); }

/* Action row */
.actions {
  display: flex;
  gap: var(--s2);
  padding-bottom: var(--s2);
}

.abtn {
  flex: 1;
  height: 48px;
  display: flex; align-items: center; justify-content: center; gap: var(--s2);
  font-family: var(--font-s);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  border-radius: 12px;
  cursor: pointer;
  border: none;
  transition: transform 0.12s var(--ease-out), filter 0.12s var(--ease-out);
}
.abtn:active { transform: scale(0.96) translateY(1px); }

.abtn-primary {
  background: var(--blue);
  color: #000;
  box-shadow: 0 4px 16px rgba(56,189,248,0.18);
}
.abtn-primary:hover { filter: brightness(1.08); }

.abtn-sec {
  background: var(--surf3);
  color: var(--text-s);
  border: 1px solid var(--brd-hi);
}
.abtn-sec:hover { color: var(--text); }

/* Tab bar */
.tabbar {
  position: sticky;
  bottom: 0;
  background: rgba(7,15,28,0.98);
  border-top: 1px solid var(--brd-hi);
  display: flex;
  height: 60px;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: var(--font-m);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-d);
  transition: color 0.15s var(--ease-out), transform 0.1s var(--ease-out);
  position: relative;
}
.tab:active { transform: scale(0.88); }
.tab.active { color: var(--blue); }
.tab.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2px;
  background: var(--blue);
  border-radius: 0 0 2px 2px;
}
.tab-ico { font-size: 16px; line-height: 1; }

@media (prefers-reduced-motion: reduce) {
  .crosshair, .ar-box, .ar-item, .item-id-badge, .conf-meter,
  .result-panel, .bk-row, .badge-status { animation: none; opacity: 1; transform: none; }
  .scan-beam { animation: none; top: 50%; }
  .status-dot { animation: none; }
}
</style>
</head>
<body>

<div class="design-label">MOCKUP 04 — SCANNER PRO &nbsp;·&nbsp; SCANFORPROFIT</div>

<div class="phone">
  <div class="notch"></div>

  <!-- Header -->
  <header class="hdr">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-text">Scan<span>.</span>Pro</div>
    </div>
    <div class="hdr-status">
      <span class="status-item">SINGLE SCAN</span>
      <button class="scan-mode-btn">SHELF ▸</button>
    </div>
  </header>

  <!-- Viewfinder -->
  <div class="viewfinder">
    <div class="vf-bg"></div>
    <div class="vf-grid"></div>

    <!-- Precision brackets -->
    <div class="bracket b-tl"></div>
    <div class="bracket b-tr"></div>
    <div class="bracket b-bl"></div>
    <div class="bracket b-br"></div>

    <!-- Crosshair -->
    <div class="crosshair">
      <div class="ch-ring"></div>
      <div class="ch-inner"></div>
      <div class="ch-dot"></div>
      <div class="ch-line-h"></div>
      <div class="ch-line-v"></div>
    </div>

    <!-- AR bounding box on item -->
    <div class="ar-box">
      <div class="ar-item">🌦️</div>
    </div>

    <!-- Animated scan beam -->
    <div class="scan-beam"></div>

    <!-- Confidence meter -->
    <div class="conf-meter">
      <div class="conf-seg filled" style="height:28px;"></div>
      <div class="conf-seg filled" style="height:22px;"></div>
      <div class="conf-seg filled" style="height:18px;"></div>
      <div class="conf-seg filled" style="height:14px;"></div>
      <div class="conf-seg empty" style="height:10px;"></div>
    </div>

    <!-- Item ID badge -->
    <div class="item-id-badge">
      <span class="badge-label">IDENTIFIED</span>
      <span class="badge-item">La Crosse WS-2317</span>
      <div class="badge-status">
        <div class="status-dot"></div>
        MATCH 94%
      </div>
    </div>
  </div>

  <!-- Result panel -->
  <div class="result-panel">

    <!-- Decision -->
    <div class="decision-hdr">
      <span class="decision-label">AI VERDICT</span>
      <div class="decision-value">
        <div class="decision-chip">BUY ↑</div>
      </div>
    </div>

    <!-- Numbers -->
    <div class="numbers-row">
      <div class="num-box">
        <div class="num-label">NET PROFIT</div>
        <div class="num-val green" id="p-num">$0</div>
      </div>
      <div class="num-box">
        <div class="num-label">ROI</div>
        <div class="num-val blue" id="r-num">0%</div>
      </div>
    </div>

    <!-- Breakdown -->
    <div class="breakdown">
      <div class="bk-row">
        <span class="bk-k">eBay sell price</span>
        <span class="bk-v">$85.00</span>
      </div>
      <div class="bk-row">
        <span class="bk-k">eBay fee (13%)</span>
        <span class="bk-v neg">−$11.05</span>
      </div>
      <div class="bk-row">
        <span class="bk-k">Shipping + pack</span>
        <span class="bk-v neg">−$10.75</span>
      </div>
      <div class="bk-row total">
        <span class="bk-k" style="color:var(--profit);font-weight:700;">Net profit</span>
        <span class="bk-v pos" style="font-size:14px;">$51.20</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="abtn abtn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        ADD TO STASH
      </button>
      <button class="abtn abtn-sec">PASS</button>
    </div>

  </div>

  <!-- Tab bar -->
  <nav class="tabbar">
    <button class="tab active" onclick="setTab(this)">
      <span class="tab-ico">⊕</span>SCANNER
    </button>
    <button class="tab" onclick="setTab(this)">
      <span class="tab-ico">⊞</span>INVENTORY
    </button>
    <button class="tab" onclick="setTab(this)">
      <span class="tab-ico">◫</span>PHOTOS
    </button>
    <button class="tab" onclick="setTab(this)">
      <span class="tab-ico">◈</span>PULSE
    </button>
    <button class="tab" onclick="setTab(this)">
      <span class="tab-ico">⊗</span>P&amp;L
    </button>
  </nav>
</div>

<script>
function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const pEl = document.getElementById('p-num');
    const rEl = document.getElementById('r-num');
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min((now - t0) / 1200, 1);
      const e = easeOutExpo(p);
      pEl.textContent = '$' + (51.20 * e).toFixed(2);
      rEl.textContent = Math.round(427 * e) + '%';
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, 1800);
});

function setTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
