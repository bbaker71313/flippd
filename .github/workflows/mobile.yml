name: EAS Build — Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, android, ios)'
        required: false
        default: 'android'
      profile:
        description: 'Build profile (development, preview, production)'
        required: false
        default: 'production'

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform || 'android' }} --profile ${{ inputs.profile || 'production' }} --non-interactive
